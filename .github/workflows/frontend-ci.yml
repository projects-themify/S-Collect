name: Frontend CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  detect:

    runs-on: self-hosted

    outputs:
      client: ${{ steps.filter.outputs.client }}
      admin: ${{ steps.filter.outputs.admin }}

    steps:

      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'Client/**'

            admin:
              - 'Admin/**'

################################################################################
# CLIENT
################################################################################

  client:

    needs: detect

    if: needs.detect.outputs.client == 'true'

    runs-on: self-hosted

    defaults:
      run:
        working-directory: Client

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Client
        uses: docker/build-push-action@v6
        with:
          context: ./Client
          file: ./Client/Dockerfile

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/client:latest
            ghcr.io/${{ github.repository_owner }}/client:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

################################################################################
# ADMIN
################################################################################

  admin:

    needs: detect

    if: needs.detect.outputs.admin == 'true'

    runs-on: self-hosted

    defaults:
      run:
        working-directory: Admin

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Admin
        uses: docker/build-push-action@v6
        with:
          context: ./Admin
          file: ./Admin/Dockerfile

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/admin:latest
            ghcr.io/${{ github.repository_owner }}/admin:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
